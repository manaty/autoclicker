name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build exe
        shell: pwsh
        run: |
          python build_windows.py

      - name: Smoke test (import only, no GUI)
        shell: pwsh
        run: |
          python -c "import autoclicker; from autoclicker.config import load_config; load_config(); print('ok')"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: autoclicker-windows
          path: dist/autoclicker.exe
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/autoclicker.exe
