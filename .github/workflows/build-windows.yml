name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Stamp version into _version.py
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $sha = "${{ github.sha }}".Substring(0, 7)
            $version = "0.0.0-dev+$sha"
          }
          $payload = "__version__ = '$version'`n"
          Set-Content -Path src/autoclicker/_version.py -Value $payload -Encoding utf8
          Write-Host "stamped $version into _version.py"

      - name: Build exe
        shell: pwsh
        run: |
          python build_windows.py

      - name: Smoke test (import only, no GUI)
        shell: pwsh
        run: |
          python -c "import autoclicker; from autoclicker.config import load_config; load_config(); print('ok')"

      # Stamp the version into the exe filename so users can keep multiple
      # downloads side-by-side. For tagged releases each tag gets its own
      # filename. For the rolling 'latest' release we keep a stable name
      # (so the URL doesn't change every commit) — the SHA goes in the
      # release body instead.
      - name: Stamp version into exe filename
        id: stamp
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $version = "${{ github.ref_name }}"      # e.g. v0.4.0
            $renamed = "dist/autoclicker-$version.exe"
          } else {
            $version = "latest"
            $renamed = "dist/autoclicker-latest.exe"
          }
          Move-Item dist/autoclicker.exe $renamed
          "exe_path=$renamed" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Built $renamed"

      # Main-branch / dispatch builds: publish to the rolling "latest"
      # pre-release. Release assets don't count against the Actions
      # storage quota (artifacts do), so this keeps working even when
      # the org-wide artifact quota is hit.
      - name: Publish rolling 'latest' release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest (auto-built from main)
          prerelease: true
          make_latest: false
          files: ${{ steps.stamp.outputs.exe_path }}
          fail_on_unmatched_files: true
          body: |
            Rolling pre-release — auto-rebuilt from `main` on every push.
            Commit: ${{ github.sha }}
            Build: ${{ steps.stamp.outputs.version }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.stamp.outputs.exe_path }}
