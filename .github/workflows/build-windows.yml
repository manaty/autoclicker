name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build exe
        shell: pwsh
        run: |
          python build_windows.py

      - name: Smoke test (import only, no GUI)
        shell: pwsh
        run: |
          python -c "import autoclicker; from autoclicker.config import load_config; load_config(); print('ok')"

      # Main-branch / dispatch builds: publish to the rolling "latest"
      # pre-release. Release assets don't count against the Actions
      # storage quota (artifacts do), so this keeps working even when
      # the org-wide artifact quota is hit.
      - name: Publish rolling 'latest' release
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest (auto-built from main)
          prerelease: true
          make_latest: false
          files: dist/autoclicker.exe
          fail_on_unmatched_files: true
          body: |
            Rolling pre-release — auto-rebuilt from `main` on every push.
            Commit: ${{ github.sha }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/autoclicker.exe
